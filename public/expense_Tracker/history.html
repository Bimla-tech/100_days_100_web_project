<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - History Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-group">
                <h1>Expense <span class="logo-accent">Tracker</span></h1>
                <p class="logo-subtext">Your money, kept simple.</p>
            </div>
            <div class="header-controls">
                <nav class="nav-links-group">
                    <a href="index.html" class="nav-link">Transactions</a>
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="history.html" class="nav-link active">History <span class="nav-badge" data-badge="count">0</span></a>
                </nav>
                <div class="utility-buttons">
                    <button id="btnExport" class="btn-secondary">Backup</button>
                    <button id="btnReset" class="btn-danger">Clear All</button>
                </div>
            </div>
        </header>

        <section class="content-card full-width-layout" style="margin-top:24px;">
            <div class="history-controls-bar">
                <h2>History Log</h2>
                <div class="search-and-filter-tools">
                    <input type="text" id="searchBar" placeholder="🔍 Search entries...">
                    <select id="categoryFilter">
                        <option value="All">All Categories</option>
                        <option value="Income">💰 Income</option>
                        <option value="Food">🍔 Food &amp; Dining</option>
                        <option value="Travel">🚗 Travel &amp; Fuel</option>
                        <option value="Shopping">🛍️ Shopping &amp; Clothes</option>
                        <option value="Bills">🏠 Bills &amp; Rent</option>
                        <option value="Others">📦 Others</option>
                    </select>
                    <div class="filter-buttons-group">
                        <button class="filter-tab active" data-filter="All">All</button>
                        <button class="filter-tab" data-filter="Income">Income</button>
                        <button class="filter-tab" data-filter="Expense">Expenses</button>
                    </div>
                </div>
            </div>

            <div class="results-count" id="resultsCount"></div>

            <div class="table-scroller">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th style="text-align:right;">Amount</th>
                            <th style="text-align:center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsBody"></tbody>
                </table>
                <div id="noTransactionsMessage" class="empty-state" style="display:none;">
                    <span class="empty-state-icon">🔍</span>
                    No matching records found. Try adjusting your search or filters.
                </div>
            </div>
        </section>
    </div>

    <div id="toast-container"></div>
    <button id="themeToggle" class="floating-theme-btn">🌓</button>
    <script src="expense.js"></script>
</body>
</html>
