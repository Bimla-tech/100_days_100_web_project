<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-layout-wrapper { width: 100%; margin-top: 24px; }
        .stats-summary-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        @media (min-width: 768px) { .stats-summary-row { grid-template-columns: repeat(4, 1fr); } }
        .premium-stat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-sm); transition: all 0.25s; display: flex; flex-direction: column; gap: 6px; }
        .premium-stat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: var(--text-sub); }
        .stat-value { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
        .stat-sub-label { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; }
        .charts-responsive-grid { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
        @media (min-width: 768px) { .charts-responsive-grid { grid-template-columns: 1fr 1fr; } }
        .premium-chart-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); }
        .premium-chart-card h2 { margin: 0 0 16px 0; font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
        .chart-viewport-box { position: relative; width: 100%; height: 300px; display: flex; align-items: center; justify-content: center; }
        .ux-empty-placeholder { color: var(--text-sub); font-size: 0.9rem; text-align: center; max-width: 260px; line-height: 1.6; padding: 40px 16px; border: 2px dashed var(--border-color); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-group">
                <h1>Expense <span class="logo-accent">Tracker</span></h1>
                <p class="logo-subtext">Your money, kept simple.</p>
            </div>
            <div class="header-controls">
                <nav class="nav-links-group">
                    <a href="index.html" class="nav-link">Transactions</a>
                    <a href="dashboard.html" class="nav-link active">Dashboard</a>
                    <a href="history.html" class="nav-link">History <span class="nav-badge" data-badge="count">0</span></a>
                </nav>
                <div class="utility-buttons">
                    <button id="btnExport" class="btn-secondary">Backup</button>
                    <button id="btnReset" class="btn-danger">Clear All</button>
                </div>
            </div>
        </header>

        <main class="dashboard-layout-wrapper">
            <section class="stats-summary-row">
                <div class="premium-stat-box" style="border-left:4px solid var(--green-success);">
                    <div class="stat-label">Total Earned</div>
                    <div id="totalIncome" class="stat-value text-green">₹0.00</div>
                </div>
                <div class="premium-stat-box" style="border-left:4px solid var(--red-error);">
                    <div class="stat-label">Total Spent</div>
                    <div id="totalExpense" class="stat-value text-red">₹0.00</div>
                </div>
                <div class="premium-stat-box" style="border-left:4px solid var(--brand-color);">
                    <div class="stat-label">Net Balance</div>
                    <div id="netBalance" class="stat-value">₹0.00</div>
                </div>
                <div class="premium-stat-box" style="border-left:4px solid var(--blue-info);">
                    <div class="stat-label">Savings Rate</div>
                    <div id="savingsRateDash" class="stat-value text-blue">0%</div>
                    <div class="stat-sub-label">of total income saved</div>
                </div>
            </section>

            <div class="charts-responsive-grid">
                <section class="premium-chart-card">
                    <h2>📈 Cash Flow Trends</h2>
                    <div class="chart-viewport-box" id="trendWrapper"><canvas id="trendChart"></canvas></div>
                </section>
                <section class="premium-chart-card">
                    <h2>🥧 Expense Allocation</h2>
                    <div class="chart-viewport-box" id="categoryWrapper"><canvas id="categoryChart"></canvas></div>
                </section>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <button id="themeToggle" class="floating-theme-btn">🌓</button>

    <script>
        let trendChartInstance = null, categoryChartInstance = null;
        function getCSSVar(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f;}
        function showToast(message, type='info'){
            let c=document.getElementById('toast-container');
            const icons={success:'✅',error:'❌',info:'ℹ️'};
            const t=document.createElement('div');
            t.className=`toast toast-${type}`;
            t.innerHTML=`<span class="toast-icon">${icons[type]||icons.info}</span><span>${message}</span>`;
            c.appendChild(t);
            setTimeout(()=>{t.classList.add('toast-exit');t.addEventListener('animationend',()=>t.remove(),{once:true});},3000);
        }
        function buildDashboard(){
            const records=JSON.parse(localStorage.getItem('budgetbuddy_data'))||[];
            let earned=0,spent=0;
            const cats={Food:0,Travel:0,Shopping:0,Bills:0,Others:0};
            const tmap={};
            records.forEach(item=>{
                const amt=parseFloat(item.amount)||0;
                const dk=item.date||'No Date';
                if(!tmap[dk])tmap[dk]={income:0,expenses:0};
                if(item.type==='Income'){earned+=amt;tmap[dk].income+=amt;}
                else{spent+=amt;tmap[dk].expenses+=amt;if(cats.hasOwnProperty(item.category))cats[item.category]+=amt;else cats.Others+=amt;}
            });
            const fmt=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'});
            const net=earned-spent;
            const sr=earned>0?Math.max(0,(net/earned)*100):0;
            document.getElementById('totalIncome').textContent=fmt.format(earned);
            document.getElementById('totalExpense').textContent=fmt.format(spent);
            const ne=document.getElementById('netBalance');
            ne.textContent=fmt.format(net);ne.className=`stat-value ${net>=0?'text-green':'text-red'}`;
            document.getElementById('savingsRateDash').textContent=`${sr.toFixed(1)}%`;
            document.querySelectorAll('.nav-badge[data-badge="count"]').forEach(b=>b.textContent=records.length);
            const tw=document.getElementById('trendWrapper'),cw=document.getElementById('categoryWrapper');
            if(trendChartInstance){trendChartInstance.destroy();trendChartInstance=null;}
            if(categoryChartInstance){categoryChartInstance.destroy();categoryChartInstance=null;}
            if(!records.length){
                tw.innerHTML='<div class="ux-empty-placeholder">📊 No transactions yet. Add records to see trends!</div>';
                cw.innerHTML='<div class="ux-empty-placeholder">🥧 No category data yet. Log an expense to start tracking.</div>';
                return;
            }
            tw.innerHTML='<canvas id="trendChart"></canvas>';
            cw.innerHTML='<canvas id="categoryChart"></canvas>';
            const tm=getCSSVar('--text-main','#0f172a'),ts=getCSSVar('--text-sub','#64748b'),bg=getCSSVar('--border-color','#e2e8f0');
            const sd=Object.keys(tmap).sort((a,b)=>new Date(a)-new Date(b));
            const hd=sd.map(d=>{const p=d.split('-');return p.length!==3?d:new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-IN',{day:'numeric',month:'short'});});
            trendChartInstance=new Chart(document.getElementById('trendChart').getContext('2d'),{type:'line',data:{labels:hd,datasets:[{label:'Income',data:sd.map(d=>tmap[d].income),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.08)',borderWidth:2.5,tension:0.3,pointRadius:4,fill:true},{label:'Expenses',data:sd.map(d=>tmap[d].expenses),borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.07)',borderWidth:2.5,tension:0.3,pointRadius:4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tm,font:{family:'inherit',size:12,weight:'500'}}}},scales:{x:{grid:{color:bg},ticks:{color:ts}},y:{grid:{color:bg},ticks:{color:ts}}}}});
            const ac=Object.keys(cats).filter(k=>cats[k]>0);
            if(!ac.length){cw.innerHTML='<div class="ux-empty-placeholder">🥧 No categorical expenses yet.</div>';}
            else{categoryChartInstance=new Chart(document.getElementById('categoryChart').getContext('2d'),{type:'doughnut',data:{labels:ac,datasets:[{data:ac.map(k=>cats[k]),backgroundColor:['#38bdf8','#fb923c','#f43f5e','#34d399','#a78bfa'],borderWidth:0,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:tm,padding:16,font:{family:'inherit',size:12}}}},cutout:'70%'}});}
        }
        document.addEventListener('DOMContentLoaded',()=>{
            const s=localStorage.getItem('budgetbuddy_theme');
            document.documentElement.setAttribute('data-theme',s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
            buildDashboard();
            document.getElementById('btnReset').addEventListener('click',()=>{if(confirm('Delete all entries?')){localStorage.removeItem('budgetbuddy_data');buildDashboard();showToast('All data cleared.','error');}});
            document.getElementById('btnExport').addEventListener('click',()=>{
                const data=JSON.parse(localStorage.getItem('budgetbuddy_data')||'[]');
                if(!data.length){showToast('No data yet!','info');return;}
                const csv=[['Date','Type','Category','Description','Amount'].join(','),...data.map(i=>[i.date,i.type,i.category,`"${String(i.description||'').replace(/"/g,'""')}"`,i.amount].join(','))].join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`Backup_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);
                showToast('Backup downloaded!','success');
            });
            document.getElementById('themeToggle').addEventListener('click',()=>{
                const c=document.documentElement.getAttribute('data-theme');
                const n=c==='dark'?'light':'dark';
                document.documentElement.setAttribute('data-theme',n);localStorage.setItem('budgetbuddy_theme',n);buildDashboard();
            });
            if(!document.getElementById('bg-aura')){const a=document.createElement('div');a.id='bg-aura';document.body.prepend(a);}
        });
    </script>
</body>
</html>
